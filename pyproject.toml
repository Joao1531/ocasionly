requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pillow>=10.4",
    "pillow-heif>=0.18",
    "python-dotenv>=1.0",
]
